[package]
name = "words-breaker"
version = "0.1.0"
edition = "2021"

[dependencies]
# Used for secp256k1 and BIP32 only; the address stage is Ethereum's (see src/eth.rs).
bitcoin = { version = "0.32", features = ["std"] }
sha3 = "0.10"
bip39 = { version = "2.0", features = ["all-languages"] }
clap = { version = "4.5", features = ["derive"] }
itertools = "0.13"
 anyhow = "1.0"
rayon = "1.10"
num_cpus = "1.16"
cust = "0.3"
hex = "0.4"
